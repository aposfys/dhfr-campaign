[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dhfrcamp"
version = "0.1.0"
description = "Retrospective structure-based virtual screening campaign against human DHFR"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Apostolos Fysekidis" }]
keywords = ["drug-design", "virtual-screening", "dhfr", "boltz", "reinvent", "docking"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
# rdkit and scikit-learn are base dependencies because the reported result needs both:
# decoy matching computes descriptors, and property_separability -- the measurement the
# campaign turns on -- is a cross-validated classifier.
dependencies = [
    "numpy>=1.24",
    "requests>=2.31",
    "rdkit>=2024.3",
    "scikit-learn>=1.4",
    "biopython>=1.83",
]

[project.optional-dependencies]
chem = ["rdkit>=2024.3", "biopython>=1.80"]
folding = ["boltz>=2.0", "torch>=2.2"]
generate = ["reinvent>=4.0"]
figures = ["matplotlib>=3.7"]
dev = ["pytest>=7.0", "numpy>=1.24", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
dhfrcamp = "dhfrcamp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 95
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]

[tool.mypy]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
exclude = ["^tests/"]


# RDKit ships partial type information: the modules resolve but their C-extension members
# do not, so every descriptor call reads as a missing attribute. Skipping the follow keeps
# mypy useful on this package's own code instead of drowning it in third-party noise.
[[tool.mypy.overrides]]
module = ["rdkit.*"]
ignore_missing_imports = true
follow_imports = "skip"
follow_imports_for_stubs = true
